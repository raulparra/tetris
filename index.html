<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    (function () {
      if (localStorage.getItem('tetris-theme') === 'light') {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
</head>
<body>
  <div class="wrapper">
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Cambiar a modo claro" title="Cambiar tema">🌙</button>
    <h1 class="game-title">TETRIS</h1>
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd> pausa</li>
          </ul>
        </div>
      </aside>
    </div>

    <div id="start-overlay" class="overlay">
      <div class="overlay-box">
        <p class="overlay-heading">TETRIS</p>
        <div class="highscores" id="start-highscores"></div>
        <div class="stats-row">
          <span>Mejor combo: <b id="start-best-combo">0</b></span>
          <span>Máx. líneas: <b id="start-max-lines">0</b></span>
        </div>
        <button id="start-play-btn" type="button">Jugar</button>
        <button id="reset-scores-btn" type="button" class="secondary-btn">Borrar records</button>
      </div>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>
        <div class="stats-row">
          <span>Líneas: <b id="gameover-lines">0</b></span>
          <span>Mejor jugada: <b id="gameover-best-combo">0</b></span>
        </div>
        <div id="highscore-entry" class="field-row hidden">
          <label for="player-name-input">¡Nuevo record! Tu nombre:</label>
          <input type="text" id="player-name-input" maxlength="12" placeholder="AAA" />
          <button id="submit-score-btn" type="button">Guardar</button>
        </div>
        <div class="highscores" id="gameover-highscores"></div>
        <button id="restart-btn">Reiniciar</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
